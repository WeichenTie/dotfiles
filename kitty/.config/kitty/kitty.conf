
# BEGIN_KITTY_THEME
# OneDark-Pro
include current-theme.conf
# END_KITTY_THEME

# Same as the neovim background (nvim/.../plugins/colors.lua). Outside the
# theme block so `kitten themes` doesn't undo it.
background              #16181d

# Every option with docs: https://sw.kovidgoyal.net/kitty/conf/

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
modify_font      cell_height 120%

# Tab bar
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         round
tab_bar_align               left
tab_bar_min_tabs            2
tab_bar_margin_height       4.0 0.0
tab_bar_margin_width        4.0
tab_title_max_length        30
tab_title_template          " {index} {title}{' ' if layout_name == 'stack' else ''} "
active_tab_title_template   " {index} {title}{' ' if layout_name == 'stack' else ''} "
# tab_bar_background          #191724
# tab_bar_margin_color        #191724
# active_tab_foreground       #191724
# active_tab_background       #c4a7e7
active_tab_font_style       bold
# inactive_tab_foreground     #908caa
# inactive_tab_background     #26233a
inactive_tab_font_style     normal
bell_on_tab                 " "
