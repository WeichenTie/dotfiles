set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin 'christoomey/vim-tmux-navigator'

# Set to vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
# Stop the mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# For Pi Agent
set -g extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'
set -gq extended-keys-format csi-u  # tmux 3.5+, ignored on older
set -g allow-passthrough on
bind -n S-Enter send-keys Escape "[13;2u"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

set -g mouse on

# Number windows and panes from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Truecolor support (so Neovim colors aren't clamped to 256 inside tmux)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

# DESIGN TWEAKS

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position bottom
set -g status-left-length 101
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold] | "
set -g window-status-current-format "#[fg=${cyan_soft},bold] ● #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

run '~/.tmux/plugins/tpm/tpm'
